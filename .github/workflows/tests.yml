name: tests
on: [push, pull_request]
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest tests.test_core tests.test_meter tests.test_autorun tests.test_controller
  python38:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.8"}
      - run: python -m unittest tests.test_core tests.test_autorun
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest -v tests.test_windows tests.test_core tests.test_autorun
      - name: start the program (simulation) and ping it
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "-m","projectorcal","--mock","--no-browser","--port","8799","--data-dir","$env:RUNNER_TEMP\pc" -PassThru
          Start-Sleep 6
          $r = Invoke-RestMethod http://127.0.0.1:8799/api/ping
          if ($r.app -ne "ProjectorCal") { exit 1 }
          $s = Invoke-RestMethod http://127.0.0.1:8799/api/session
          if ($s.platform -ne "windows") { exit 1 }
          Stop-Process -Id $p.Id
